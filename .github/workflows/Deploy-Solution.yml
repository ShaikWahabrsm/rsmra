name: Deploy Power Platform Solution (Managed)

on:
  push:
    branches:
      - main

jobs:
  export-solution:
    runs-on: windows-latest

    env:
      SOLUTION_NAME: CostcoDev
      SOLUTION_PATH: Solutions/CostcoDev
      PACKED_OUTPUT: packed
      ZIP_NAME: CostcoDev_managed.zip
      TARGET_ENVIRONMENT_URL: https://org3cd22ca1.crm.dynamics.com

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify PAC CLI
        run: pac help

      - name: Authenticate with Power Platform
        run: |
          pac auth create --applicationId ${{ secrets.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRET }} --tenant ${{ secrets.TENANT_ID }} --environment ${{ env.TARGET_ENVIRONMENT_URL }}

      - name: Pack Solution (Managed)
        shell: pwsh
        run: |
          mkdir $env:PACKED_OUTPUT -Force
          $zipFilePath = Join-Path $env:PACKED_OUTPUT $env:ZIP_NAME
          pac solution pack `
            --zipfile "$zipFilePath" `
            --folder "$env:SOLUTION_PATH" `
            --packagetype Managed

      - name: Import Solution
        shell: pwsh
        run: |
          pac solution import `
            --path "$env:PACKED_OUTPUT\\$env:ZIP_NAME"
