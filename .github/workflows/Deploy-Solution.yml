name: Deploy Power Platform Solution (Managed)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    env:
      SOLUTION_NAME: CostcoDev
      SOLUTION_PATH: Solutions/CostcoDev
      PACKED_OUTPUT: packed
      ZIP_NAME: CostcoDev_managed.zip
      TARGET_ENVIRONMENT_URL: https://org3cd22ca1.crm.dynamics.com

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3.6.0
      
    - name: Download PAC CLI Installer
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://aka.ms/PowerAppsCLI -OutFile pac.msi

    - name: Install PAC CLI
      shell: pwsh
      run: |
        Start-Process msiexec.exe -ArgumentList '/i pac.msi /quiet /norestart' -Wait

    - name: Add PAC CLI to PATH
      shell: pwsh
      run: |
        $pacPath = "C:\Program Files (x86)\Microsoft Power Platform CLI"
        echo "Adding PAC CLI to PATH: $pacPath"
        echo "$pacPath" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

    - name: Verify PAC CLI is available
      shell: pwsh
      run: |
        pac --version

    - name: Pack Solution (Managed)
      shell: pwsh
      run: |
        mkdir $env:PACKED_OUTPUT
        pac solution pack `
          --path "$env:SOLUTION_PATH" `
          --packagetype Managed `
          --outputDirectory "$env:PACKED_OUTPUT"

    - name: Authenticate to Target Environment
      shell: pwsh
      run: |
        pac auth clear
        pac auth create `
          --clientId "${{ secrets.CLIENT_ID }}" `
          --clientSecret "${{ secrets.CLIENT_SECRET }}" `
          --tenant "${{ secrets.TENANT_ID }}" `
          --url "$env:TARGET_ENVIRONMENT_URL"

    - name: Import Solution
      shell: pwsh
      run: |
        pac solution import `
          --path "$env:PACKED_OUTPUT\\$env:ZIP_NAME"
